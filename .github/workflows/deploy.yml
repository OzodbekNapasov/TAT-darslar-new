# ============================================================================
# GitHub Pages deploy'i O'CHIRILGAN.
#
# Sayt endi Vercel orqali chiqariladi (qarang: vercel.json).
# Avtomatik ishga tushish (push) olib tashlandi, faqat qo'lda ishga tushirish
# qoldirildi. Agar GitHub Pages'ga qaytmoqchi bo'lsangiz, quyidagi
# "workflow_dispatch:" ustiga shu ikki qatorni qaytaring:
#
#   push:
#     branches: ["main"]
# ============================================================================
name: Deploy to GitHub Pages (o'chirilgan - Vercel ishlatiladi)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
