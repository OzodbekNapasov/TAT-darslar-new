<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5-Dars: Kompyuter va uning qurilmalari — Axborot Texnologiyalari</title>
  <meta name="description" content="5-dars: Kompyuter va uning ichki hamda tashqi qurilmalari, xotira (HDD va SSD) bo'yicha mukammal elektron qo'llanma.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z'/></svg>">
  <style>
    :root, [data-theme="dark"] {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
      --primary-light: rgba(79, 70, 229, 0.16);
      --primary-border: rgba(99, 102, 241, 0.35);
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.15);
      --success-border: rgba(16, 185, 129, 0.3);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.15);
      --danger-border: rgba(239, 68, 68, 0.3);
      --warn: #f59e0b;
      --warn-light: rgba(245, 158, 11, 0.15);
      --warn-border: rgba(245, 158, 11, 0.3);
      --purple: #8b5cf6;
      --purple-light: rgba(139, 92, 246, 0.15);
      --purple-border: rgba(139, 92, 246, 0.3);
      --teal: #0d9488;
      --teal-light: rgba(13, 148, 136, 0.15);
      --teal-border: rgba(13, 148, 136, 0.3);
      --dark: #f8fafc;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --subtle: #64748b;
      --bg: #090d16;
      --card: #131b2e;
      --card-hover: #17223b;
      --border: #1e293b;
      --table-border: #334155;
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 14px 32px -6px rgba(0, 0, 0, 0.6);
      --shadow-hover: 0 12px 32px -4px rgba(99, 102, 241, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1560px;
      width: 96%;
      margin: 0 auto;
      padding: 1.5rem 1.75rem 4rem 1.75rem;
    }

    /* ====================================================================== */
    /* 1. SARLAVHA (HERO) BLOKI                                               */
    /* ====================================================================== */
    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: var(--primary-gradient);
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.35);
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 32px;
      height: 32px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .header-titles h1 {
      font-size: 1.85rem;
      font-weight: 850;
      color: var(--dark);
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .header-titles .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1.1rem;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .hero-intro {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 1rem;
      color: var(--text);
      line-height: 1.7;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .badge-primary { background: var(--primary-light); color: var(--primary); border: 1px solid var(--primary-border); }
    .badge-success { background: var(--success-light); color: var(--success); border: 1px solid var(--success-border); }
    .badge-warn    { background: var(--warn-light);    color: #b45309;        border: 1px solid var(--warn-border); }
    .badge-purple  { background: var(--purple-light);  color: var(--purple);  border: 1px solid var(--purple-border); }
    .badge-teal    { background: var(--teal-light);    color: var(--teal);    border: 1px solid var(--teal-border); }

    /* ====================================================================== */
    /* 2. MAQSADLI TUSHUNTIRISH & DAFTARGA YOZISH RO'YXATI (KONSPEKT)        */
    /* ====================================================================== */
    .classification-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow);
    }

    .classification-title-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .classification-title {
      font-size: 1.3rem;
      font-weight: 850;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .concept-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.25rem;
    }

    .concept-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .concept-card.internal-concept {
      border-top: 4px solid var(--primary);
    }

    .concept-card.external-concept {
      border-top: 4px solid var(--teal);
    }

    .concept-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.2rem;
    }

    .concept-header h3 {
      font-size: 1.18rem;
      font-weight: 850;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .konspekt-def-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.6;
    }

    .konspekt-list-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--dark);
      margin-top: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .konspekt-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .konspekt-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.85rem;
      font-size: 0.86rem;
      line-height: 1.5;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .konspekt-item:hover {
      border-color: var(--primary);
      transform: translateX(4px);
      box-shadow: var(--shadow-sm);
    }

    .external-concept .konspekt-item:hover {
      border-color: var(--teal);
    }

    .konspekt-num {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 850;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .external-concept .konspekt-num {
      background: var(--teal-light);
      color: var(--teal);
    }

    .konspekt-item-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .konspekt-item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .konspekt-item-name {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--dark);
    }

    .konspekt-item-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .konspekt-group-badge-wrap {
      margin-top: 0.4rem;
      margin-bottom: 0.1rem;
    }

    /* ====================================================================== */
    /* 3. 2 USTUNLI TEZKOR RO'YXAT                                           */
    /* ====================================================================== */
    .overview-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow);
    }

    .overview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .overview-header h2 {
      font-size: 1.2rem;
      font-weight: 850;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .overview-col {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .overview-col.col-main {
      border-top: 4px solid var(--primary);
    }

    .overview-col.col-extra {
      border-top: 4px solid var(--teal);
    }

    .col-title-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
    }

    .col-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .quick-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .quick-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      transition: all 0.18s ease;
      text-decoration: none;
      color: var(--text);
    }

    .quick-item:hover {
      border-color: var(--primary);
      transform: translateX(4px);
      box-shadow: var(--shadow-sm);
    }

    .quick-item-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      color: var(--dark);
    }

    .quick-item-num {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .col-extra .quick-item-num {
      background: var(--teal-light);
      color: var(--teal);
    }

    .quick-item-role {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: normal;
    }

    /* ====================================================================== */
    /* 4. NAVIGATSIYA TABS                                                    */
    /* ====================================================================== */
    .tabs-nav-container {
      position: sticky;
      top: 1rem;
      z-index: 100;
      margin-bottom: 1.75rem;
    }

    .tabs-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      background: var(--card);
      padding: 0.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.8rem 1.1rem;
      background: transparent;
      border: none;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 750;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      white-space: nowrap;
    }

    .tab-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .tab-btn:hover {
      color: var(--dark);
      background: rgba(79, 70, 229, 0.07);
    }

    .tab-btn.active {
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    .tab-btn.active svg {
      stroke: #ffffff;
    }

    .tab-pane {
      display: none;
      animation: fadeInTab 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-pane.active {
      display: block;
    }

    @keyframes fadeInTab {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    
    /* Hayotiy misol va Upgrade imkoniyati bloklari */
    .device-insights-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }

    .insight-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .insight-box.insight-example {
      border-left: 3.5px solid var(--teal);
    }

    .insight-box.insight-upgrade {
      border-left: 3.5px solid var(--success);
    }

    .insight-title {
      font-size: 0.76rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .insight-example .insight-title {
      color: var(--teal);
    }

    .insight-upgrade .insight-title {
      color: var(--success);
    }

    .insight-text {
      font-size: 0.84rem;
      color: var(--text);
      line-height: 1.5;
    }

    /* Section card */
    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.85rem 2.25rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow);
    }

    .section-header {
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .section-header h2 {
      font-size: 1.5rem;
      font-weight: 850;
      color: var(--dark);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-header p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 0.25rem;
    }

    .sub-section-divider {
      margin: 2rem 0 1.25rem 0;
      padding-bottom: 0.5rem;
      border-bottom: 2px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .sub-section-divider h3 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* ====================================================================== */
    /* 5. RO'YXAT USLUBIDAGI QURILMA KARTASI (DEVICE LIST ITEM)               */
    /* ====================================================================== */
    .devices-list-stack {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .device-list-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: grid;
      grid-template-columns: 380px 1fr;
      align-items: stretch;
    }

    .device-list-item:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-border);
      background: var(--card-hover);
    }

    /* Rasm sig'ishi uchun keng va moslashuvchan media-box */
    .device-media-box {
      background: radial-gradient(ellipse at center, #1e293b 0%, #0b1120 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 250px;
      padding: 16px;
    }

    .device-media-img {
      max-width: 100%;
      max-height: 225px;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      transition: transform 0.35s ease;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
    }

    .device-list-item:hover .device-media-img {
      transform: scale(1.04);
    }

    .media-badge-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      backdrop-filter: blur(8px);
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .device-info-content {
      padding: 1.35rem 1.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.8rem;
    }

    .device-info-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .device-heading-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .device-index-num {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--primary);
      opacity: 0.85;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .device-heading-title {
      font-size: 1.25rem;
      font-weight: 850;
      color: var(--dark);
      line-height: 1.3;
    }

    .device-tech-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-top: 0.15rem;
    }

    .device-description-text {
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.6;
    }

    .device-fact-box {
      background: var(--bg);
      border-left: 3.5px solid var(--warn);
      padding: 0.7rem 0.95rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.55;
    }

    .device-fact-box strong {
      color: #b45309;
      display: block;
      margin-bottom: 0.2rem;
      font-size: 0.85rem;
    }

    [data-theme="dark"] .device-fact-box strong {
      color: #f59e0b;
    }

    .device-specs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
    }

    .spec-badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.22rem 0.6rem;
      border-radius: 6px;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    /* ====================================================================== */
    /* 6. XOTIRA: HDD VA SSD BO'LIMI                                          */
    /* ====================================================================== */
    .storage-header-banner {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: var(--shadow);
    }

    .storage-header-banner h3 {
      font-size: 1.35rem;
      font-weight: 850;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .storage-header-banner p {
      color: #cbd5e1;
      font-size: 0.93rem;
      line-height: 1.6;
    }

    .storage-deep-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .storage-deep-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s ease;
    }

    .storage-deep-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .storage-deep-media {
      height: 250px;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #1e293b 0%, #0b1120 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }

    .storage-deep-img {
      max-width: 100%;
      max-height: 220px;
      width: auto;
      height: auto;
      object-fit: contain;
      transition: transform 0.4s ease;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5));
    }

    .storage-deep-card:hover .storage-deep-img {
      transform: scale(1.04);
    }

    .storage-deep-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      flex-grow: 1;
    }

    .storage-deep-body h3 {
      font-size: 1.3rem;
      font-weight: 850;
      color: var(--dark);
    }

    .principle-box {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 0.9rem 1.1rem;
      border: 1px solid var(--border);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .principle-box h4 {
      font-size: 0.88rem;
      font-weight: 800;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--primary);
    }

    .bullet-features {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .bullet-features li {
      font-size: 0.85rem;
      color: var(--text);
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      line-height: 1.5;
    }

    .bullet-features li svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 3px;
    }

    /* Comparison Table */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow-sm);
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      text-align: left;
    }

    .custom-table th {
      background: var(--bg);
      color: var(--dark);
      font-weight: 800;
      padding: 1rem 1.25rem;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    .custom-table td {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }

    .custom-table tbody tr:last-child td {
      border-bottom: none;
    }

    .custom-table tbody tr:hover {
      background: rgba(79, 70, 229, 0.03);
    }

    .val-better {
      color: var(--success);
      font-weight: 750;
    }

    .advice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
    }

    .advice-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem;
    }

    .advice-card.highlight {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .advice-card h4 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .advice-card p {
      font-size: 0.87rem;
      color: var(--text);
      line-height: 1.6;
    }

    /* ====================================================================== */
    /* 7. TEST BO'LIMI (QUIZ)                                                 */
    /* ====================================================================== */
    .quiz-container {
      margin-top: 2rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
    }

    .quiz-title {
      font-size: 1.35rem;
      font-weight: 850;
      color: var(--dark);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .quiz-subtitle {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .quiz-question-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .quiz-q-num {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    .quiz-q-text {
      font-size: 1rem;
      font-weight: 750;
      color: var(--dark);
      margin-bottom: 1rem;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }

    .quiz-opt-btn {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
      width: 100%;
    }

    .quiz-opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      transform: translateX(3px);
    }

    .quiz-opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .quiz-opt-btn.correct {
      background: var(--success-light) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: 700;
    }

    .quiz-opt-btn.correct .quiz-opt-letter {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    .quiz-opt-btn.wrong {
      background: var(--danger-light) !important;
      border-color: var(--danger) !important;
      color: var(--danger) !important;
    }

    .quiz-opt-btn.wrong .quiz-opt-letter {
      background: var(--danger);
      color: #ffffff;
      border-color: var(--danger);
    }

    .quiz-explanation {
      margin-top: 0.85rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      display: none;
      line-height: 1.55;
    }

    .quiz-explanation.show {
      display: block;
    }

    .quiz-explanation.correct-exp {
      background: var(--success-light);
      color: #065f46;
      border: 1px solid var(--success-border);
    }

    .quiz-explanation.wrong-exp {
      background: var(--danger-light);
      color: #991b1b;
      border: 1px solid var(--danger-border);
    }

    .quiz-score-banner {
      display: none;
      background: var(--card);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 1.75rem;
      text-align: center;
      margin-top: 1.5rem;
    }

    .quiz-score-banner.show {
      display: block;
    }

    .quiz-score-banner h3 {
      font-size: 1.4rem;
      font-weight: 850;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }

    .restart-btn {
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      padding: 0.7rem 1.6rem;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 750;
      cursor: pointer;
      margin-top: 1rem;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      transition: all 0.2s ease;
    }

    .restart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.4);
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* ====================================================================== */
    /* RESPONSIVE DIZAYN                                                      */
    /* ====================================================================== */
    @media (max-width: 1200px) {
      .device-list-item {
        grid-template-columns: 320px 1fr;
      }
    }
    @media (max-width: 768px) {
      .quiz-options {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 850px) {
      .tabs-nav {
        grid-template-columns: 1fr 1fr;
      }
      .overview-grid,
      .concept-cards-grid,
      .storage-deep-grid {
        grid-template-columns: 1fr;
      }
      .device-list-item {
        grid-template-columns: 1fr;
      }
      .device-media-box {
        min-height: 230px;
      }
      .device-media-img {
        max-height: 200px;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 1rem 0.75rem 3rem 0.75rem;
      }
      .hero-card,
      .section-card {
        padding: 1.25rem;
      }
      .header-titles h1 {
        font-size: 1.4rem;
      }
      .tabs-nav {
        grid-template-columns: 1fr;
      }
      .tab-btn {
        justify-content: flex-start;
      }
      .device-info-content {
        padding: 1.15rem;
      }
    }

    @media print {
      .tabs-nav-container,
      .theme-toggle-btn,
      .quiz-container,
      .print-btn,
      button {
        display: none !important;
      }
      .tab-pane {
        display: block !important;
      }
      .device-list-item {
        page-break-inside: avoid;
        box-shadow: none;
        border: 1px solid #ccc;
      }

      /* qog'ozda qora fon siyoh sarflaydi va o'qilmaydi */
      html, body {
        background: #ffffff !important;
        color: #000000 !important;
      }

      * {
        box-shadow: none !important;
        text-shadow: none !important;
        animation: none !important;
      }

      /* rasm varaqdan chiqib ketmasin */
      img {
        max-width: 100% !important;
        height: auto !important;
        page-break-inside: avoid;
      }

      table {
        page-break-inside: avoid;
        font-size: 10pt;
      }
    }

    /* Chop etish tugmasi */
    .print-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--border-color, #cbd5e1);
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
  </style>

<style id="tat-topic-cover-style">
.tat-topic-cover {
  position: relative !important;
  min-height: 100vh !important;
  min-height: 100dvh !important;
  width: 100% !important;
  background-image: url('./cover_bg.jpg') !important;
  background-size: cover !important;
  background-position: center !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  cursor: pointer !important;
  border-bottom: 1px solid rgba(59, 130, 246, 0.3) !important;
  overflow: hidden !important;
  z-index: 40 !important;
  flex-shrink: 0 !important;
}
.tat-topic-cover::before {
  content: '' !important;
  position: absolute !important;
  inset: 0 !important;
  backdrop-filter: blur(12px) !important;
  -webkit-backdrop-filter: blur(12px) !important;
  background: rgba(7, 9, 14, 0.65) !important;
}
.tat-topic-cover-inner {
  position: relative !important;
  z-index: 2 !important;
  text-align: center !important;
  padding: 2rem 1.5rem !important;
  max-width: 920px !important;
  width: 100% !important;
}
.tat-topic-cover-title {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  font-size: clamp(1.85rem, 5.2vw, 3.5rem) !important;
  font-weight: 900 !important;
  letter-spacing: -0.03em !important;
  line-height: 1.16 !important;
  color: #ffffff !important;
  margin: 0 0 1.1rem 0 !important;
  background: none !important;
  -webkit-text-fill-color: #ffffff !important;
}
.tat-topic-cover-date {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  font-size: clamp(0.95rem, 2.5vw, 1.15rem) !important;
  font-weight: 600 !important;
  color: rgba(255, 255, 255, 0.8) !important;
  margin: 0 !important;
}
</style>
<script id="tat-topic-cover-script">
(function(){
  var TITLE_HTML = "Kompyuter va uning qurilmalari";
  function getDateStr() {
    var now = new Date();
    var months = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'];
    var days = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
    return now.getFullYear() + '-yil ' + now.getDate() + '-' + months[now.getMonth()] + ', ' + days[now.getDay()];
  }
  function ensureCover() {
    if (!document.body) return;
    var existing = document.getElementById('tat-topic-cover');
    if (!existing) {
      var div = document.createElement('div');
      div.id = 'tat-topic-cover';
      div.className = 'tat-topic-cover';
      div.onclick = function() {
        window.scrollTo({ top: window.innerHeight, behavior: 'smooth' });
      };
      div.innerHTML =
        '<div class="tat-topic-cover-inner">' +
          '<h1 class="tat-topic-cover-title">' + TITLE_HTML + '</h1>' +
          '<p class="tat-topic-cover-date" id="tat-topic-cover-date">' + getDateStr() + '</p>' +
        '</div>';
      document.body.insertBefore(div, document.body.firstChild);
    } else {
      if (document.body.firstElementChild !== existing) {
        document.body.insertBefore(existing, document.body.firstElementChild);
      }
      var dateEl = document.getElementById('tat-topic-cover-date');
      if (dateEl && dateEl.textContent === 'Bugun') {
        dateEl.textContent = getDateStr();
      }
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ensureCover);
  } else {
    ensureCover();
  }
  var obs = new MutationObserver(function() {
    ensureCover();
  });
  function startObserver() {
    if (!document.body) {
      setTimeout(startObserver, 20);
      return;
    }
    ensureCover();
    obs.observe(document.body, { childList: true });
  }
  startObserver();
  setInterval(ensureCover, 200);
})();
</script>
</head>

    <h1 class="tat-topic-cover-title">Kompyuter va uning qurilmalari</h1>
    <p class="tat-topic-cover-date" id="tat-topic-cover-date">Bugun</p>
  </div>
</div><!-- /TAT FULLSCREEN TOPIC COVER -->
